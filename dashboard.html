              </div>
              <div class="meta">
                📍 ${b.city} (${b.neighborhood}) &nbsp;|&nbsp; 🏢 ${b.sector} &nbsp;|&nbsp; 📞 <strong>${b.phone}</strong> &nbsp;|&nbsp; 🌐 ${siteLink}
              </div>
              <div class="issues">
                ${b.issues.map(iss => `<span class="issue-tag">⚠️ ${iss}</span>`).join('')}
              </div>
              <div class="pitch-box">
                <strong>Pitch suggéré :</strong> ${b.pitch}
              </div>
            </div>
            <div class="actions">
              ${waButton}
              <button class="btn btn-copy" onclick="navigator.clipboard.writeText(LEADS[${idx}].pitch); this.textContent='✅ Pitch copié !'; setTimeout(()=>this.textContent='📋 Copier le pitch', 1500);">📋 Copier le pitch</button>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('statusFilter').addEventListener('change', render);
    document.getElementById('sectorFilter').addEventListener('change', render);
    render();
  </script>
</body>
</html>
